syntax = "proto3";

package xunxian.scene;

option go_package = "xunxian/proto/scene";

// ═══════════════════════════════════════════
//  场景服务 - 进入 / 移动 / AOI同步 / NPC交互
// ═══════════════════════════════════════════

// 进入场景
message EnterSceneRequest {
  int64 player_id = 1;
  int32 scene_id = 2;
}

message EnterSceneResponse {
  int32 code = 1;
  string msg = 2;
  repeated EntityState entities = 3;   // 可见实体列表
  float  pos_x = 4;
  float  pos_y = 5;
}

// 离开场景
message LeaveSceneRequest {
  int64 player_id = 1;
  int32 scene_id = 2;
}

message LeaveSceneResponse {
  int32 code = 1;
  string msg = 2;
}

// 移动请求（客户端 → 服务端）
message MoveRequest {
  float x = 1;          // 目标x坐标
  float y = 2;          // 目标y坐标
  uint32 seq = 3;       // 帧序号
  int32 dir = 4;        // 朝向 0-7
}

// 服务端同步帧（服务端 → 客户端）
message SyncFrame {
  repeated EntityState entities = 1;
  uint32 server_seq = 2;
}

// 实体状态
message EntityState {
  int64  entity_id = 1;
  float  x = 2;
  float  y = 3;
  int32  dir = 4;        // 朝向 0-7
  int32  action = 5;     // 0=idle 1=walk 2=run 3=attack 4=sit
  string name = 6;
  int32  entity_type = 7; // 1=player 2=npc
  int32  gender = 8;
  int32  level_stage = 9;
  int32  level_tier = 10;
}

// 实体进入可视范围事件
message EnterEvent {
  EntityState entity = 1;
}

// 实体离开可视范围事件
message LeaveEvent {
  int64 entity_id = 1;
}

// NPC 交互
message InteractRequest {
  int64  player_id = 1;
  int32  npc_id = 2;
  string action = 3;     // shop / quest / talk
}

message InteractResponse {
  int32  code = 1;
  string msg = 2;
  string type = 3;       // dialog / shop / quest
  string data = 4;       // JSON 格式的交互数据
}

// 聊天消息
message ChatMessage {
  int64  sender_id = 1;
  string sender_name = 2;
  int32  channel = 3;    // 1=世界 2=帮派 3=私聊
  string text = 4;
  int64  timestamp = 5;
}

// 发送聊天
message SendChatRequest {
  int32  channel = 1;
  string text = 2;
  int64  target_id = 3;  // 私聊时指定目标
}

message SendChatResponse {
  int32  code = 1;
  string msg = 2;
}

// ═══════════════════════════════════════════
//  会话服务 - 心跳 / 踢下线 / 重连
// ═══════════════════════════════════════════

// 心跳
message Heartbeat {
  int64 timestamp = 1;
}

message HeartbeatAck {
  int64 server_time = 1;
}

// 踢下线事件
message KickOutEvent {
  string reason = 1;
}

// 重连请求
message ReconnectRequest {
  string token = 1;
  int64  player_id = 2;
  uint32 last_seq = 3;   // 客户端最后收到的帧序号
}

message ReconnectResponse {
  int32 code = 1;
  string msg = 2;
  repeated EntityState entities = 3;
  float  pos_x = 4;
  float  pos_y = 5;
  uint32 server_seq = 6;
}

// WebSocket 消息信封
message WsMessage {
  string type = 1;         // 消息类型
  bytes  payload = 2;      // Protobuf 序列化的消息体
}
