# 副本服务配置（花果山副本 + 牢结值系统）
# 严格按照《寻仙-花果山副本设计文档 V3》和《花果山副本技术方案》实现
server:
  port: 8007
  name: dungeon-service

mysql:
  # 副本会话、玩家背包、奖励发放记录、牢结值状态、死亡描述配置均在 game_main 库
  dsn: "root:password@tcp(127.0.0.1:3306)/game_main?charset=utf8mb4&parseTime=true&loc=Local"
  max_open_conns: 50
  max_idle_conns: 10

redis:
  # 用于：会话临时状态、观测度累加、牢结值缓存、唯一性奖励分布式锁
  addr: "127.0.0.1:6379"
  password: ""
  db: 0
