# 装备服务配置（寻仙装备系统）
# 严格按照《寻仙·装备系统 PRD+技术方案》实现
server:
  port: 8009
  name: equipment-service

mysql:
  # 品质配置/装备实例/附加属性/打造品级/掉落表/套装/碎片/继承/交易/修理日志均在 game_main 库
